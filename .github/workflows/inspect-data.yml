name: Inspect data sources
on:
  push:
    branches: [dev]
    paths:
      - "scripts/inspect_sources.py"
      - ".github/workflows/inspect-data.yml"
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q geopandas pyogrio shapely pandas
      - run: python scripts/inspect_sources.py
      - name: Save report
        if: always()
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd report
          git init -q -b data-report
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "Source report"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}" data-report
