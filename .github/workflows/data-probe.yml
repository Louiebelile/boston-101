name: Data probe
on:
  push:
    paths:
      - ".github/workflows/data-probe.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check data sources
        run: |
          mkdir -p probe && cd probe
          ua="boston-101-data-check"
          head_check() { code=$(curl -sIL -A "$ua" -m 45 -o /dev/null -w '%{http_code} %header{content-length}' "$2" || echo fail); echo "$1 | $code | $2" >> status.txt; }
          for q in "buildings" "food establishment" "public schools" "non public schools" "colleges universities" "city council districts" "boston neighborhood boundaries" "property assessment" "article80" "wards precincts" "main streets" "open space" "street trees" "landmarks"; do
            f="ckan-$(echo "$q" | tr ' ' '-').json"
            curl -sSL -A "$ua" -m 60 -G "https://data.boston.gov/api/3/action/package_search" --data-urlencode "q=$q" --data-urlencode "rows=8" -o raw.json -w "ckan $q | %{http_code}\n" >> status.txt || echo "ckan $q | fail" >> status.txt
            jq '[.result.results[]? | {name,title,resources:[.resources[]? | {name,format,url,id,datastore_active}]}]' raw.json > "$f" 2>/dev/null || true
          done
          rm -f raw.json
          for q in 'owner:BostonGIS buildings' 'title:"Boston Buildings"' 'title:"Boston 3D Buildings"' 'owner:BostonGIS neighborhood'; do
            f="arcgis-$(echo "$q" | tr -cd 'a-zA-Z0-9').json"
            curl -sSL -A "$ua" -m 60 -G "https://www.arcgis.com/sharing/rest/search" --data-urlencode "q=$q" --data-urlencode "f=json" --data-urlencode "num=25" -o raw.json -w "arcgis $q | %{http_code}\n" >> status.txt || echo "arcgis $q | fail" >> status.txt
            jq '[.results[]? | {id,title,type,owner,url,numViews}]' raw.json > "$f" 2>/dev/null || true
          done
          rm -f raw.json
          m="https://s3.us-east-1.amazonaws.com/download.massgis.digital.mass.gov/shapefiles"
          head_check massgis-rapid "$m/state/mbta_rapid_transit.zip"
          head_check massgis-trains "$m/state/trains.zip"
          head_check massgis-senate "$m/state/senate2021.zip"
          head_check massgis-house "$m/state/house2021.zip"
          head_check massgis-structures "$m/structures/structures_poly_35.zip"
          head_check massgis-structures2 "$m/state/structures_poly_35.zip"
          head_check mbta-gtfs "https://cdn.mbta.com/MBTA_GTFS.zip"
          curl -sS -A "$ua" -m 90 "https://overpass-api.de/api/interpreter" --data-urlencode 'data=[out:json][timeout:60];way["building"](42.27,-71.10,42.33,-71.03);out count;' -o overpass.json -w "overpass | %{http_code}\n" >> status.txt || echo "overpass | fail" >> status.txt
          cat status.txt
      - name: Save results to a separate branch
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd probe
          git init -q -b data-probe
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Data source check"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}" data-probe
